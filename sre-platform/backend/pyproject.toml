[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-platform"
version = "0.1.0"
description = "airlab SRE Agent Management Platform — FastAPI backend, PostgreSQL kalıcılığı, ajan hafızası (airlab-agent çekirdeğini kullanır)"
requires-python = ">=3.12"
dependencies = [
  "airlab-sre-agent",                       # ../../sre-agent (mevcut çekirdek: MCP, sinyaller, puanlama, atıf, LangGraph)
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "sse-starlette==3.7.0",
  "sqlalchemy[asyncio]==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary,pool]==3.3.9",
  "langgraph-checkpoint-postgres==3.2.1",
  "pyjwt==2.15.1",
  "pyyaml>=6.0",
  "jsonschema>=4.20",                       # Agent Builder: input / output şeması doğrulama (ajan kilidinde sabit)
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx"]

[project.scripts]
sre-platform = "sre_platform.cli:main"

[tool.setuptools.packages.find]
include = ["sre_platform*"]

[tool.setuptools.package-data]
sre_platform = ["db/alembic.ini", "db/migrations/*.py", "db/migrations/versions/*.py", "seed/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
