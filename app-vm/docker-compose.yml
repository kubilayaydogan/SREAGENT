# APP_VM (Rocky Linux 9) — dört iş uygulaması + chaos-controller + read-only PG collector.
# PostgreSQL BURADA DEĞİL: DB_VM'de systemd servisi (db-vm/). Yerel geliştirmede
# compose.local.yml bir PG17 container'ı ekler (yalnız test amaçlı).
#
#   cd app-vm && cp .env.example .env && chmod 600 .env   # değerleri doldur
#   docker compose build
#   docker compose --profile tools run --rm db-migrator migrate
#   docker compose --profile tools run --rm db-migrator seed --scale=1
#   docker compose up -d
#   docker compose --profile observability up -d pg-lock-collector

name: airlab

x-app: &app
  restart: unless-stopped
  env_file: .env
  networks: [airlab]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }
  environment: &app-env
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-airlab}
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
    LAB_TOKEN: ${LAB_TOKEN}
    LAB_ALLOWED_CIDRS: ${LAB_ALLOWED_CIDRS:-172.28.0.0/24,127.0.0.1/32}
    LAB_MAX_HOLD_MS: ${LAB_MAX_HOLD_MS:-5000}
    LAB_PRESSURE_POOL_MAX: ${LAB_PRESSURE_POOL_MAX:-22}
    HIKARI_MAX_POOL: ${HIKARI_MAX_POOL:-8}
    HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-2}
    HIKARI_CONNECTION_TIMEOUT_MS: ${HIKARI_CONNECTION_TIMEOUT_MS:-2000}
    TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-50}
    LOG_FORMAT: ${LOG_FORMAT:-ecs}
    TZ: UTC
    # Chaos v2 dependency-call allowlist'i (app → app). Uygulamalar normal akışta birbirini çağırmaz.
    LAB_CHAOS_PEERS_RESERVATION: http://reservation:8081
    LAB_CHAOS_PEERS_CHECKIN: http://checkin:8082
    LAB_CHAOS_PEERS_FLIGHTOPS: http://flightops:8083
    LAB_CHAOS_PEERS_BAGGAGE: http://baggage:8084
    # S11 duty-cycle CPU burn (1 vCPU quota içinde) ve S12 heap ballast üst sınırı: max heap'in %50'si
    # (%70 ile canlı set + allocation burst'leri birleşince OutOfMemoryError ölçüldü)
    LAB_CHAOS_MAX_CPU_THREADS: ${LAB_CHAOS_MAX_CPU_THREADS:-6}
    LAB_CHAOS_MAX_MEMORY_FRACTION: ${LAB_CHAOS_MAX_MEMORY_FRACTION:-0.5}

# Chaos v2 netem sidecar: uygulamanın network namespace'ini paylaşır; yalnız o container'ın egress'ine,
# yalnız NETEM_TARGETS allowlist'indeki hedeflere tc netem uygular. Yalnız CAP_NET_ADMIN; port yayımlanmaz.
x-netem: &netem
  restart: unless-stopped
  image: airlab/netem-agent:${IMAGE_TAG:-1.0.0}
  build: { context: ../observability/netem-agent }
  cap_drop: [ALL]
  cap_add: [NET_ADMIN]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  mem_limit: 48m
  cpus: 0.1
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  reservation:
    <<: *app
    image: airlab/reservation:${IMAGE_TAG:-1.0.0}
    build: { context: .., target: reservation }
    container_name: airlab-reservation
    hostname: reservation
    environment:
      <<: *app-env
      DB_USER: svc_reservation
      DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      DT_TAGS: "airlab airlab_service=reservation"
    ports: ["${APP_BIND_IP:-127.0.0.1}:8081:8081"]
    mem_limit: ${APP_MEM_LIMIT:-640m}
    cpus: ${APP_CPUS:-1.0}

  checkin:
    <<: *app
    image: airlab/checkin:${IMAGE_TAG:-1.0.0}
    build: { context: .., target: checkin }
    container_name: airlab-checkin
    hostname: checkin
    environment:
      <<: *app-env
      DB_USER: svc_checkin
      DB_PASSWORD: ${CHECKIN_DB_PASSWORD}
      DT_TAGS: "airlab airlab_service=checkin"
    ports: ["${APP_BIND_IP:-127.0.0.1}:8082:8082"]
    mem_limit: ${APP_MEM_LIMIT:-640m}
    cpus: ${APP_CPUS:-1.0}

  flightops:
    <<: *app
    image: airlab/flightops:${IMAGE_TAG:-1.0.0}
    build: { context: .., target: flightops }
    container_name: airlab-flightops
    hostname: flightops
    environment:
      <<: *app-env
      DB_USER: svc_flightops
      DB_PASSWORD: ${FLIGHTOPS_DB_PASSWORD}
      DT_TAGS: "airlab airlab_service=flightops"
    ports: ["${APP_BIND_IP:-127.0.0.1}:8083:8083"]
    mem_limit: ${APP_MEM_LIMIT:-640m}
    cpus: ${APP_CPUS:-1.0}

  baggage:
    <<: *app
    image: airlab/baggage:${IMAGE_TAG:-1.0.0}
    build: { context: .., target: baggage }
    container_name: airlab-baggage
    hostname: baggage
    environment:
      <<: *app-env
      DB_USER: svc_baggage
      DB_PASSWORD: ${BAGGAGE_DB_PASSWORD}
      DT_TAGS: "airlab airlab_service=baggage"
    ports: ["${APP_BIND_IP:-127.0.0.1}:8084:8084"]
    mem_limit: ${APP_MEM_LIMIT:-640m}
    cpus: ${APP_CPUS:-1.0}

  netem-reservation:
    <<: *netem
    container_name: airlab-netem-reservation
    network_mode: "service:reservation"
    environment: &netem-env
      NETEM_APP: reservation
      LAB_TOKEN: ${LAB_TOKEN}
      NETEM_ALLOWED_CIDRS: 172.28.0.50/32
      NETEM_TARGETS: db=${DB_HOST}:${DB_PORT:-5432},reservation=reservation,checkin=checkin,flightops=flightops,baggage=baggage
    depends_on: [reservation]

  netem-checkin:
    <<: *netem
    container_name: airlab-netem-checkin
    network_mode: "service:checkin"
    environment: { <<: *netem-env, NETEM_APP: checkin }
    depends_on: [checkin]

  netem-flightops:
    <<: *netem
    container_name: airlab-netem-flightops
    network_mode: "service:flightops"
    environment: { <<: *netem-env, NETEM_APP: flightops }
    depends_on: [flightops]

  netem-baggage:
    <<: *netem
    container_name: airlab-netem-baggage
    network_mode: "service:baggage"
    environment: { <<: *netem-env, NETEM_APP: baggage }
    depends_on: [baggage]

  chaos:
    restart: unless-stopped
    image: airlab/chaos-controller:${IMAGE_TAG:-1.0.0}
    build: { context: .., target: chaos }
    container_name: airlab-chaos
    hostname: chaos
    networks:
      airlab:
        ipv4_address: 172.28.0.50
    env_file: .env
    environment:
      RESERVATION_URL: http://reservation:8081
      CHECKIN_URL: http://checkin:8082
      FLIGHTOPS_URL: http://flightops:8083
      BAGGAGE_URL: http://baggage:8084
      LAB_TOKEN: ${LAB_TOKEN}
      CHAOS_USER: ${CHAOS_USER:-chaos}
      CHAOS_PASSWORD: ${CHAOS_PASSWORD}
      CHAOS_DATA_DIR: /data/experiments
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      DT_TAGS: "airlab airlab_service=chaos"
      TZ: UTC
      # Chaos v2 gözlem: YALNIZ read-only lab_monitor (pg_monitor) rolü — pg_stat_* + lab_os.host_stats().
      # Workload'lar DB'ye chaos-controller'dan değil, uygulamaların kendi rolleriyle gider.
      MONITOR_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-airlab}?ApplicationName=chaos-observer&connectTimeout=3&socketTimeout=10
      MONITOR_DB_USER: lab_monitor
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      NETEM_PORT: "9190"
      DT_UI_URL: ${DT_UI_URL:-${DT_URL:-}}
    volumes: ["chaos-data:/data"]
    ports: ["${APP_BIND_IP:-127.0.0.1}:8080:8080"]
    mem_limit: ${CHAOS_MEM_LIMIT:-512m}
    cpus: ${CHAOS_CPUS:-1.0}
    depends_on: [reservation, checkin, flightops, baggage]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  pg-lock-collector:
    profiles: [observability]
    restart: unless-stopped
    image: airlab/pg-lock-collector:${IMAGE_TAG:-1.0.0}
    build: { context: ../observability/pg-lock-collector }
    container_name: airlab-pg-lock-collector
    networks: [airlab]
    environment:
      PG_HOST: ${DB_HOST}
      PG_PORT: ${DB_PORT:-5432}
      PG_DB: ${DB_NAME:-airlab}
      PG_USER: lab_monitor
      PG_PASSWORD: ${MONITOR_DB_PASSWORD}
      DB_HOST_LABEL: ${DB_HOST_LABEL:-db-vm}
      INTERVAL_S: ${COLLECTOR_INTERVAL_S:-5}
      STATEMENTS_INTERVAL_S: ${COLLECTOR_STATEMENTS_INTERVAL_S:-60}
      DT_MODE: ${COLLECTOR_DT_MODE:-dryrun}
      DT_URL: ${DT_URL:-}
      DT_API_TOKEN: ${DT_INGEST_TOKEN:-}
      DRYRUN_FILE: /data/collector.jsonl
    volumes: ["collector-data:/data"]
    mem_limit: 128m
    cpus: 0.25

  db-migrator:
    profiles: [tools]
    image: airlab/db-migrator:${IMAGE_TAG:-1.0.0}
    build: { context: .., target: migrator }
    networks: [airlab]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-airlab}
      DB_OWNER_USER: lab_owner
      DB_OWNER_PASSWORD: ${OWNER_DB_PASSWORD}
      LAB_ALLOW_RESET: ${LAB_ALLOW_RESET:-false}

  # ---- Aşama 2: SRE Agent (salt-okur; tek canlı veri kaynağı Dynatrace Remote MCP, DB bağlantısı YOK)
  # Gizli değerler agent.env'de (scripts/gen-agent-env.sh üretir, chmod 600, repoya girmez).
  sre-agent:
    profiles: [agent]
    restart: unless-stopped
    image: airlab/sre-agent:${IMAGE_TAG:-1.0.0}
    build: { context: ../sre-agent }
    container_name: airlab-sre-agent
    command: ["watch"]
    env_file: [agent.env]
    environment:
      AGENT_DATA_DIR: /data
    volumes: ["agent-data:/data"]
    networks: [agent]            # airlab ağına (servisler/DB) bağlı değil; yalnız dışa HTTPS
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s       # SIGTERM → mevcut tick biter, durum SQLite'ta kalır

  # Aynı imajdan ayrı CLI oturumları: docker compose run --rm sre-agent-cli ask "..."
  sre-agent-cli:
    profiles: [agent-cli]
    image: airlab/sre-agent:${IMAGE_TAG:-1.0.0}
    entrypoint: ["sre-agent"]
    command: ["--help"]
    env_file: [agent.env]
    environment:
      AGENT_DATA_DIR: /data
    volumes: ["agent-data:/data"]
    networks: [agent]
    stdin_open: true
    tty: true
    mem_limit: 512m
    cpus: 0.5

  # ---- SRE Operations Platform (sre-platform/): PostgreSQL + FastAPI + worker + React arayüz, aynı APP_VM'de.
  # Gizli değerler sre-platform.env (scripts/gen-sre-platform-env.sh üretir, chmod 600) + agent.env (Dynatrace/Claude).
  #   docker compose --profile platform build
  #   docker compose --profile platform up -d           # sre-migrate şemayı/tohumu uygular, sonra servisler kalkar
  #   docker compose stop sre-agent                     # eski SQLite watch'unu durdur (sre-worker devralır)
  # Arayüz: http://<APP_VM>:8090
  sre-postgres:
    profiles: [platform]
    image: postgres:17.7-alpine
    container_name: sre-postgres
    restart: unless-stopped
    env_file: [sre-platform.env]          # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: sre
      POSTGRES_DB: sre
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: ["postgres", "-c", "max_connections=80", "-c", "shared_buffers=128MB", "-c", "work_mem=8MB",
              "-c", "log_min_duration_statement=2000", "-c", "idle_in_transaction_session_timeout=300000"]
    volumes: ["sre-pg-data:/var/lib/postgresql/data"]
    networks: [sre-data]                   # port yayımlanmaz; yalnız backend/worker erişir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 60s
    logging: &sre-log
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  sre-migrate:
    profiles: [platform]
    image: airlab/sre-platform-backend:${SRE_IMAGE_TAG:-0.1.0}
    build: { context: .., dockerfile: sre-platform/backend/Dockerfile }
    command: ["migrate", "--seed"]
    env_file: [sre-platform.env]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      sre-postgres: { condition: service_healthy }
    networks: [sre-data]
    mem_limit: 256m
    cpus: 0.5
    logging: *sre-log

  sre-backend:
    profiles: [platform]
    image: airlab/sre-platform-backend:${SRE_IMAGE_TAG:-0.1.0}
    container_name: sre-backend
    command: ["serve", "--port", "8000"]
    restart: unless-stopped
    env_file: [agent.env, sre-platform.env]
    environment:
      AGENT_DATA_DIR: /data
    volumes: ["sre-platform-data:/data"]
    depends_on:
      sre-migrate: { condition: service_completed_successfully }
    networks: [sre-data, sre-web, agent]   # agent: dışa HTTPS (Dynatrace MCP, Claude API)
    mem_limit: 640m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *sre-log

  sre-worker:
    profiles: [platform]
    image: airlab/sre-platform-backend:${SRE_IMAGE_TAG:-0.1.0}
    container_name: sre-worker
    command: ["worker"]
    restart: unless-stopped
    env_file: [agent.env, sre-platform.env]
    environment:
      AGENT_DATA_DIR: /data
      SRE_WORKER_ID: sre-worker-1
      SRE_DB_POOL_SIZE: "3"
    volumes:
      - "sre-platform-data:/data"
      - "agent-data:/legacy:ro"            # eski sre-agent raporları: sre-platform import-reports /legacy/reports
    depends_on:
      sre-migrate: { condition: service_completed_successfully }
    networks: [sre-data, agent]
    healthcheck: { disable: true }         # HTTP sunmaz; canlılık: Agent Activity → Zamanlanmış kontroller
    mem_limit: 640m
    cpus: 0.75
    stop_grace_period: 60s                 # SIGTERM → mevcut iş biter; kira süresi dolarsa iş başka worker'a geçer
    logging: *sre-log

  sre-frontend:
    profiles: [platform]
    image: airlab/sre-platform-frontend:${SRE_IMAGE_TAG:-0.1.0}
    build: { context: ../sre-platform/frontend }
    container_name: sre-frontend
    restart: unless-stopped
    ports: ["${SRE_UI_PORT:-8090}:80"]
    depends_on:
      sre-backend: { condition: service_healthy }
    networks: [sre-web]
    mem_limit: 96m
    cpus: 0.25
    logging: *sre-log

networks:
  sre-data:
    name: airlab-sre-data
    internal: true                         # PostgreSQL ağı dışa kapalı
  sre-web:
    name: airlab-sre-web
  airlab:
    name: airlab
    ipam:
      config:
        - subnet: 172.28.0.0/24
  agent:
    name: airlab-agent

volumes:
  chaos-data:
  collector-data:
  agent-data:
  sre-pg-data:
  sre-platform-data:
