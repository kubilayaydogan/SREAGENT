[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airlab-sre-agent"
version = "1.0.0"
description = "airlab için Dynatrace MCP üzerinden çalışan, salt-okur SRE Agent (Aşama 2)"
requires-python = ">=3.12"
# Sürümler 2026-11-21'de PyPI'dan doğrulandı ve kurulu paketlerin API'si incelenerek sabitlendi.
# mcp 1.30.0: langchain-mcp-adapters 0.3.2 "mcp<2" ister (mcp 2.x ile çözümlenemiyor).
dependencies = [
  "langchain==1.5.2",
  "langchain-core==1.8.4",
  "langchain-anthropic==1.7.12",
  "langgraph==1.2.24",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langsmith==0.16.0",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "pydantic==2.14.4",
  "pyyaml==6.0.4",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
sre-agent = "airlab_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airlab_agent = ["defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
