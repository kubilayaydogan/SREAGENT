# airlab — PostgreSQL 17 lab ayarları (DB_VM: 2 vCPU / 4 GB varsayımı)
# install-postgres17.sh bu dosyayı $PGDATA/conf.d/lab.conf olarak kopyalar.
# @...@ yer tutucuları db-vm.env değerleriyle doldurulur.

listen_addresses = '@DB_LISTEN_ADDR@'
port = @DB_PORT@

# --- Bağlantı kapasitesi ---
# 100 slot = 3 superuser + 3 reserved (pg_use_reserved_connections: lab_monitor, dynatrace)
#           + 94 normal. Servis başına 8'lik pool * 4 = 32 normal kullanım.
max_connections = @PG_MAX_CONNECTIONS@
superuser_reserved_connections = 3
reserved_connections = 3

# --- Bellek ---
shared_buffers = @PG_SHARED_BUFFERS@
effective_cache_size = @PG_EFFECTIVE_CACHE_SIZE@
work_mem = 8MB
maintenance_work_mem = 256MB

# --- İstatistik / gözlemlenebilirlik ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
track_activity_query_size = 4096
compute_query_id = on
track_io_timing = on
track_functions = pl

# --- Kilit / timeout güvenliği ---
log_lock_waits = on
deadlock_timeout = 1s
idle_in_transaction_session_timeout = 60s
# İstemci (ör. abort edilen Hikari bağlantısı) koptuysa uzun sorgu sırasında da fark et (Linux)
client_connection_check_interval = 2s

# --- Log ---
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h xid=%x '
log_timezone = 'UTC'
timezone = 'UTC'

password_encryption = scram-sha-256
